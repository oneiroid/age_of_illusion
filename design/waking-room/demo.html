<!doctype html>
<html lang="en" data-theme="lodge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waking Room demo</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  main { max-width: 1040px; margin: 0 auto; padding: var(--space-40) var(--space-16) var(--space-64); display: flex; flex-direction: column; gap: var(--space-40); }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  h2.label-row { margin: 0; color: var(--text-muted); }
</style>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/waking-room.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  var W = window.WakingRoom, h = React.createElement;
  function Demo() {
    var s = React.useState('lodge'), theme = s[0], setTheme = s[1];
    React.useEffect(function () { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
    return h('main', null,
      h('div', { className: 'bar' },
        h('h1', { className: 'display-l wr-ghost-text', style: { margin: 0 } }, 'Waking Room'),
        h(W.Button, { onClick: function () { setTheme(theme === 'lodge' ? 'insomnia' : 'lodge'); } }, theme === 'lodge' ? 'Turn on the light' : 'Turn it off')),
      h(W.Veil, { src: theme === 'lodge' ? 'textures/mirror-blood.webp' : 'textures/mirror-print.webp', height: 420, shape: true },
        h('h2', { className: 'wr-veil-title' }, 'This room is not here'),
        h('div', { className: 'wr-veil-sub' }, 'You have been here before. 03:47.')),
      h(W.ChevronRule, { pitch: 'l' }),
      h('div', { style: { display: 'flex', justifyContent: 'center' } }, h(W.WakeClock, { live: true, note: 'awake 41 h 12 m · same hour as yesterday' })),
      h(W.MirrorPanel, { label: 'You and the other one', lit: true,
        left: h(React.Fragment, null, h(W.Stamp, null, 'You'), h('div', { className: 'heading' }, '03:47'), h('div', { className: 'body-s', style: { color: 'var(--text-muted)' } }, 'Went to bed')),
        right: h(React.Fragment, null, h(W.Stamp, { tone: 'lamp', dot: true }, 'The other'), h('div', { className: 'heading' }, '03:47'), h('div', { className: 'body-s', style: { color: 'var(--text-muted)' } }, 'Is still up')) }),
      h(W.Quote, { size: 'l', ghost: true, echo: true, source: 'tape 14, side b, 03:47' }, 'I closed my eyes and the room stayed.'),
      h('div', { style: { display: 'flex', gap: 'var(--space-24)', flexWrap: 'wrap' } },
        h(W.Field, { label: 'Your name', placeholder: 'The one you were given', hint: 'Use the name you were given, not the one you remember.' }),
        h(W.Field, { label: 'Hours slept', defaultValue: 'none', error: 'This needs a number. Enter it again.' })),
      h('div', { style: { display: 'flex', gap: 'var(--space-16)', alignItems: 'center', flexWrap: 'wrap' } },
        h(W.Button, { variant: 'curtain' }, 'Stay'), h(W.Button, null, 'Leave'), h(W.Button, { variant: 'lamp' }, 'Wake up'),
        h(W.Stamp, null, 'Room 3'), h(W.Stamp, { tone: 'curtain' }, 'Do not enter')),
      h('p', { className: 'transcript wr-enter', style: { margin: 0, color: 'var(--text-muted)' } }, '03:47. Still here. The light in the hall is on again.'),
      h(W.ChevronRule, { pitch: 's' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
