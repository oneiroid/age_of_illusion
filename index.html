<!doctype html>
<html lang="en" data-theme="lodge">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Illusions</title>
  <link rel="stylesheet" href="design/waking-room/tokens.css">
  <link rel="stylesheet" href="design/waking-room/components.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="layout">
    <aside class="side">
      <h1 id="brand" class="brand heading">Illusions</h1>
      <svg class="wr-chev brand-floor" width="100%" height="28" aria-hidden="true">
        <defs>
          <pattern id="floor" width="24" height="28" patternUnits="userSpaceOnUse">
            <rect class="wr-chev-ground" width="24" height="28"></rect>
            <path class="wr-chev-stripe" d="M0 12 L12 2 L24 12 M0 26 L12 16 L24 26" stroke-width="5"></path>
          </pattern>
        </defs>
        <rect width="100%" height="28" fill="url(#floor)"></rect>
      </svg>
      <nav id="nav" class="nav" aria-label="Illusions"></nav>
      <div class="side-foot">
        <div id="lang" class="lang-switch" role="group" aria-label="Language / Язык">
          <button class="wr-btn wr-btn-quiet" type="button" data-lang="en" lang="en" aria-label="English">EN</button>
          <button class="wr-btn wr-btn-quiet" type="button" data-lang="ru" lang="ru" aria-label="Русский">RU</button>
        </div>
        <button id="fullscreen" class="wr-btn wr-btn-quiet" type="button"><span id="fullscreen-label"></span> <kbd>F</kbd></button>
        <p class="keys"><kbd>←</kbd> <kbd>→</kbd> <span id="keys-or"></span> <kbd>1</kbd>–<kbd>9</kbd> <span id="keys-switch"></span></p>
      </div>
    </aside>

    <section id="stage" class="stage" aria-live="off"></section>

    <aside id="panel" class="panel">
      <p id="index" class="index wr-stamp wr-stamp-neutral"></p>
      <h2 id="title" class="title heading wr-ghost-text"></h2>
      <p id="credit" class="credit caption"></p>

      <h3 id="howto-h">How to view</h3>
      <p id="howto"></p>

      <div id="expect-wrap">
        <h3 id="expect-h">What happens</h3>
        <p id="expect"></p>
      </div>

      <div id="controls-wrap" hidden>
        <h3 id="controls-h">Controls</h3>
        <div id="controls" class="controls"></div>
      </div>

      <details id="why" class="why">
        <summary id="why-h">Why it happens</summary>
        <div id="why-body"></div>
      </details>
    </aside>
  </main>

  <script src="js/core.js"></script>
  <script src="js/illusions/lilac.js"></script>
  <script src="js/illusions/mib.js"></script>
  <script src="js/illusions/spiral.js"></script>
  <script src="js/illusions/feet.js"></script>
  <script src="js/illusions/breathing.js"></script>
  <script src="js/illusions/snakes.js"></script>
  <script src="js/illusions/silencing.js"></script>
  <script src="js/illusions/checker-shadow.js"></script>
  <script src="js/illusions/double-drift.js"></script>
  <script src="js/illusions/kinetic-depth.js"></script>
  <script src="js/illusions/ghost-word.js"></script>
  <script src="js/mind/oracle-model.js"></script>
  <script src="js/illusions/oracle.js"></script>
  <script src="js/mind/ninety-model.js"></script>
  <script src="js/illusions/ninety.js"></script>
  <script src="js/mind/who-model.js"></script>
  <script src="js/illusions/who.js"></script>
  <script src="js/mind/principle-model.js"></script>
  <script src="js/illusions/principle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
